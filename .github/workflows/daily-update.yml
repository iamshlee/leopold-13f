name: Daily 13F update & deploy

on:
  schedule:
    # 매일 00:00 UTC = 한국시간(KST) 오전 9시
    - cron: "0 0 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write   # 갱신된 portfolio.json 커밋
  pages: write      # GitHub Pages 배포
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 최신 13F 데이터 가져오기
        run: python3 update.py

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/portfolio.json; then
            git add data/portfolio.json
            git commit -m "chore: $(date -u +%Y-%m-%d) 13F 포트폴리오 자동 업데이트"
            git push
          else
            echo "변경 사항 없음"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
